<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>活动报名 · 聚场</title><link rel="stylesheet" href="/static/enroll.css?v=20261110"><script src="/static/enroll.js?v=20261112" defer></script></head>
<body><main><header class="page-heading"><a href="/guide" class="brand">聚场 GatherSpace</a><span>活动报名</span></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="login-panel" hidden><h1>欢迎回来</h1><p>登录后，选择场次报名。</p><form id="login-form"><label>登录名或手机号<input name="login" autocomplete="username" required maxlength="100"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary" type="submit">登录</button></form><p class="hint">首次使用或忘记密码？在群里发送 <strong>@机器人 手动报名</strong>，进入页面后设置网页登录。</p></section>
<section id="member-panel" hidden><div class="member-heading"><div><h1 id="greeting"></h1><p id="bot-name"></p></div><div class="header-actions"><button id="account-open" class="quiet" type="button">登录设置</button><button id="logout" class="quiet" type="button">退出</button></div></div>
<form id="filters" class="filters"><label id="bot-picker">报名机器人<select id="bot-select"></select></label><label>活动日期<input id="day" type="date" required></label><label>场地<select id="venue"><option value="">所有场地</option></select></label></form>
<div id="sessions" aria-live="polite"></div><footer><a href="/guide#manual-enrollment">查看报名说明 ↗</a></footer></section>
</main>
<dialog id="booking-dialog"><form id="booking-form"><div class="dialog-heading"><h2>参加活动</h2><button class="quiet close" type="button" data-close="booking-dialog" aria-label="关闭报名窗口">×</button></div><p id="booking-label"></p><label>同行姓名<span class="hint">选填，多人用逗号分隔</span><input name="guests" maxlength="1600" placeholder="如：张三，李四"></label><label>或填写同行人数<input name="guest_count" type="number" min="0" max="20" step="1" value="0"></label><p id="booking-error" class="error" role="alert"></p><button class="primary" type="submit">确认报名</button></form></dialog>
<dialog id="account-dialog"><div class="dialog-heading"><h2>网页登录</h2><button class="quiet close" type="button" data-close="account-dialog" aria-label="关闭登录设置">×</button></div><p id="account-note">先在群里确认本人身份，再设置登录名和密码。</p><button id="request-binding" class="primary" type="button">获取确认指令</button><div id="binding-command" hidden><p>请由本人向机器人发送：</p><code id="confirmation-command"></code><button id="copy-command" class="quiet" type="button">复制指令</button><button id="check-binding" type="button">我已发送，检查确认</button></div><form id="account-form" hidden><label>登录名<input name="login" autocomplete="username" required pattern="[a-zA-Z][a-zA-Z0-9_.\-]{2,39}" maxlength="40" placeholder="字母开头，3–40位"></label><label>新密码<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024" placeholder="至少12位"></label><label>再次输入密码<input name="repeat" type="password" autocomplete="new-password" required minlength="12" maxlength="1024"></label><button class="primary" type="submit">保存登录信息</button></form><p id="account-error" class="error" role="alert"></p></dialog>
</body></html>
